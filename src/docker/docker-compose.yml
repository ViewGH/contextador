# Operator — Contextador's Mainframe server
version: "3"

services:
  operator:
    image: ghcr.io/viewgh/operator:latest
    container_name: contextador-operator
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPERATOR_PORT:-6167}:6167"
    volumes:
      - operator-data:/data/operator
      - ./operator.generated.toml:/config/operator.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6167/_matrix/client/versions"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  operator-data:
